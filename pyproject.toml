[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-default-args"
dynamic = ["version"]
description = "Shared and per-call dynamic defaults for Python functions and methods"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT-0"
license-files = ["LICENSE.txt"]
authors = [{name = "Hoang-Nhat Tran (inspiros)", email = "hnhat.tran@gmail.com"}]
keywords = ["dynamic-default-args", "default-arguments", "default-factory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[project.urls]
Source = "https://github.com/inspiros/dynamic-default-args"
Documentation = "https://github.com/inspiros/dynamic-default-args/tree/master/docs"
Issues = "https://github.com/inspiros/dynamic-default-args/issues"

[project.optional-dependencies]
cython = ["Cython>=3.0,<4"]
dev = ["build>=1", "twine>=6", "Cython>=3.0,<4"]

[tool.setuptools.dynamic]
version = {attr = "dynamic_default_args._version.__version__"}

[tool.setuptools.packages.find]
include = ["dynamic_default_args*"]
