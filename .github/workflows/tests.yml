name: Tests

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Version tag to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.python != '3.8'
        run: python -m pip install -e '.[cython]'
      # The build backend, setuptools>=77, needs Python 3.9+; test from the checkout.
      - if: matrix.python == '3.8'
        run: python -m pip install Cython setuptools
      - run: python -m unittest discover -s tests -v
        env:
          DDA_TEST_CYTHON: '1'
