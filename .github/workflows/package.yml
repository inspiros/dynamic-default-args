name: Package

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      ref:
        description: Version tag to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check tag matches package version
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref }}
        run: |
          python - <<'PY'
          import os, runpy
          version = runpy.run_path('dynamic_default_args/_version.py')['__version__']
          expected = f'refs/tags/v{version}'
          if os.environ['RELEASE_REF'] != expected:
              raise SystemExit(f'Release ref must match package version: {expected}')
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Smoke-test the pure-Python wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "$GITHUB_WORKSPACE"/dist/*-py3-none-any.whl
          python -c "import dynamic_default_args as m; print(m.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.tar.gz
            dist/*-py3-none-any.whl
          if-no-files-found: error
